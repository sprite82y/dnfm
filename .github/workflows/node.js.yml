
name: Deploy Vue to GitHub Pages

on:
  push:
    branches:
      - main

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许只有一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 要求 ^20.19.0 || >=22.12.0，固定到 22 更稳
          node-version: 22
          cache: 'npm'
      
      - name: Install Dependencies
        # 用 ci 而非 install：严格按 package-lock.json 安装，保证与本地一致
        run: npm ci
      
      - name: Run Tests
        run: npm test
      
      - name: Build Project
        run: npm run build
      
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite 默认打包输出目录为 dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
