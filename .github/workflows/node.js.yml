
name: Deploy Vue to GitHub Pages

on:
  push:
    branches:
      - main

# 默认最小权限：每个 job 按需在上方声明自己的 permissions，
# 避免 build 阶段执行第三方依赖脚本时手里握着 pages:write / id-token:write
# 文档：https://docs.github.com/actions/reference/security/secure-use#use-minimal-permissions
permissions:
  contents: read

# 允许只有一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建只需要读仓库：会跑 npm ci（含第三方依赖脚本），
    # 故不授予 pages:write / id-token:write
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 要求 ^20.19.0 || >=22.12.0，固定到 22 更稳
          node-version: 22
          cache: 'npm'
      
      - name: Install Dependencies
        # 用 ci 而非 install：严格按 package-lock.json 安装，保证与本地一致。
        # 本地 lock 的 resolved 指向 npmmirror 镜像，CI 里强制改走官方源：
        #   --registry                   指到 npmjs
        #   --replace-registry-host=always 把 lock 中 tarball URL 的 host 重写为上面的源
        # 只换下载地址，不改版本也不改 integrity，仍是严格安装（等价 npmjs 版 lock）。
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always
      
      - name: Run Tests
        run: npm test
      
      - name: Build Project
        run: npm run build
      
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite 默认打包输出目录为 dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    # 只有真正发布 Pages 的 job 才需要这两项
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
